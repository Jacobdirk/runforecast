<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Times to Run Today</title>
  <style>
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); color: #fff; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    #status { opacity: .8; margin: 1rem 0 1.5rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
    input { padding: .6rem .8rem; border: 0; border-radius: 8px; font-size: 1rem; width: 220px; }
    button { padding: .6rem 1rem; border: 0; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    #results { display: flex; flex-direction: column; gap: .3rem; margin-top: .5rem; }
    #results button { background: rgba(255,255,255,.15); color: #fff; text-align: left; }
    #results button:hover { background: rgba(255,255,255,.3); }
    #settings { margin-top: 1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    #settings input { width: auto; }
    .cards { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .card { background: rgba(255,255,255,.12); border-radius: 16px; padding: 1.25rem 1.5rem; width: 220px; }
    .rank { font-size: 2rem; }
    .time { font-size: 1.8rem; font-weight: bold; margin: .25rem 0; }
    .score { font-size: .9rem; opacity: .8; margin-bottom: .5rem; }
    .card ul { list-style: none; padding: 0; margin: 0; line-height: 1.6; }

    *, *::before, *::after { box-sizing: border-box; }
    h1 { font-size: clamp(1.5rem, 6vw, 2.25rem); text-align: center; margin: 0 0 1rem; }
    form, #results, #settings, #status, .cards { width: 100%; max-width: 720px; }
    #status { text-align: center; }
    input, button { min-height: 44px; font-size: 16px; }
    input { flex: 1 1 220px; max-width: 100%; }
    #settings input { flex: 0 0 auto; }
    .time-range, .duration { display: inline-flex; align-items: center; gap: .5rem; }
    #settings #duration { width: 5rem; }
    .card { flex: 1 1 220px; max-width: 320px; }
    .card.warning { outline: 2px solid #ffb300; }
    .warn { background: rgba(255,179,0,.2); border-radius: 8px; padding: .4rem .6rem; font-size: .85rem; margin-bottom: .5rem; }
    .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; width: 100%; max-width: 720px; }
    .tabs button { flex: 1; background: rgba(255,255,255,.15); color: #fff; }
    .tabs button.active { background: #fff; color: #1e3c72; font-weight: bold; }
    .tab { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .tab[hidden] { display: none; }
    .panel { width: 100%; max-width: 720px; background: rgba(255,255,255,.12); border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .panel h2 { font-size: 1.15rem; margin: 0 0 .75rem; }
    .weight { display: grid; grid-template-columns: 9rem 1fr 3rem; align-items: center; gap: .5rem; margin: .4rem 0; }
    .weight input { width: 100%; min-height: auto; padding: 0; flex: none; }
    .weight output { text-align: right; }
    .block-row { display: flex; align-items: center; gap: .5rem; margin: .4rem 0; }
    .block-row input { flex: 1 1 0; min-width: 0; width: auto; }
    .block-row button { background: rgba(255,255,255,.2); color: #fff; }
    .hint { font-size: .85rem; opacity: .8; margin: .25rem 0 .5rem; }

    @media (max-width: 600px) {
      body { padding: 1rem .75rem; }
      form { flex-direction: column; align-items: stretch; }
      input { width: 100%; flex: none; }
      #settings { font-size: .95rem; flex-direction: column; align-items: stretch; text-align: center; }
      .time-range { display: flex; align-items: center; gap: .5rem; width: 100%; }
      #settings .time-range input { flex: 1 1 0; min-width: 0; width: auto; }
      .time-range span { flex: 0 0 auto; }
      .duration { justify-content: center; }
      .cards { flex-direction: column; align-items: stretch; }
      .card { width: 100%; max-width: none; padding: 1rem 1.25rem; }
      .rank { font-size: 1.6rem; }
      .time { font-size: 1.5rem; }
      .weight { grid-template-columns: 7rem 1fr 2.5rem; }
    }
  </style>
</head>
<body>
  <h1>🏃 Best Times to Run Today</h1>

  <div class="tabs">
    <button type="button" class="active" data-tab="mainTab">🏠 Planner</button>
    <button type="button" data-tab="settingsTab">⚙️ Settings</button>
  </div>

  <div class="tab" id="mainTab">
  <form id="searchForm">
    <input id="searchInput" type="text" placeholder="Search a city, e.g. Urk" required>
    <button type="submit">Search</button>
    <button type="button" id="geoBtn">📍 Use my location</button>
  </form>
  <div id="results"></div>

  <div id="settings">
    <span class="settings-label">Start a run between</span>
    <span class="time-range">
      <input type="time" id="fromTime" value="05:00">
      <span>and</span>
      <input type="time" id="toTime" value="22:00">
    </span>
    <span class="duration">
      <label for="duration">Run duration</label>
      <input type="number" id="duration" value="45" min="1" max="240" inputmode="numeric">
      <span>min</span>
    </span>
  </div>

  <div id="status">Getting your location…</div>
  <div class="cards" id="cards"></div>
  </div>

  <div class="tab" id="settingsTab" hidden>
    <div class="panel">
      <h2>Score weights</h2>
      <p class="hint">How much each factor counts. 0 = ignore, 1 = default, 3 = very important.</p>
      <div id="weights"></div>
      <button type="button" id="resetWeights">Reset to defaults</button>
    </div>
    <div class="panel">
      <h2>Blocked times</h2>
      <p class="hint">Times when you can't run, e.g. work or meetings. Runs won't overlap these.</p>
      <div id="blockedList"></div>
      <button type="button" id="addBlocked">+ Add blocked time</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const cardsEl = document.getElementById('cards');
    const resultsEl = document.getElementById('results');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const fromInput = document.getElementById('fromTime');
    const toInput = document.getElementById('toTime');
    const durationInput = document.getElementById('duration');
    let lastLocation = null;

    function setSetting(name, value) {
      try { localStorage.setItem(name, value); } catch { }
    }

    function getSetting(name) {
      try { return localStorage.getItem(name); } catch { return null; }
    }

    function getJson(name, fallback) {
      try { return JSON.parse(getSetting(name)) ?? fallback; } catch { return fallback; }
    }

    function rerun() {
      if (lastLocation) run(lastLocation.lat, lastLocation.lon, lastLocation.label);
    }

    const weightDefs = [
      { key: 'temp', label: '🌡️ Temperature' },
      { key: 'rainChance', label: '🌧️ Rain chance' },
      { key: 'rain', label: '☔ Rain amount' },
      { key: 'wind', label: '💨 Wind' },
      { key: 'uv', label: '☀️ UV' },
      { key: 'humidity', label: '💧 Humidity' },
      { key: 'dark', label: '🌙 Darkness' }
    ];
    const weights = Object.assign(Object.fromEntries(weightDefs.map(w => [w.key, 1])), getJson('weights', {}));
    let blocked = getJson('blocked', []);

    const weightsEl = document.getElementById('weights');
    function renderWeights() {
      weightsEl.innerHTML = '';
      weightDefs.forEach(w => {
        const row = document.createElement('label');
        row.className = 'weight';
        row.innerHTML = `<span>${w.label}</span><input type="range" min="0" max="3" step="0.1"><output></output>`;
        const range = row.querySelector('input');
        const out = row.querySelector('output');
        range.value = weights[w.key];
        out.textContent = (+weights[w.key]).toFixed(1);
        range.addEventListener('input', () => {
          weights[w.key] = +range.value;
          out.textContent = weights[w.key].toFixed(1);
          setSetting('weights', JSON.stringify(weights));
        });
        range.addEventListener('change', rerun);
        weightsEl.appendChild(row);
      });
    }

    document.getElementById('resetWeights').onclick = () => {
      weightDefs.forEach(w => weights[w.key] = 1);
      setSetting('weights', JSON.stringify(weights));
      renderWeights();
      rerun();
    };

    const blockedListEl = document.getElementById('blockedList');
    function saveBlocked() {
      setSetting('blocked', JSON.stringify(blocked));
      rerun();
    }

    function renderBlocked() {
      blockedListEl.innerHTML = blocked.length ? '' : '<p class="hint">No blocked times.</p>';
      blocked.forEach((b, i) => {
        const row = document.createElement('div');
        row.className = 'block-row';
        row.innerHTML = '<input type="time"><span>to</span><input type="time"><button type="button" aria-label="Remove">✕</button>';
        const [fromEl, toEl] = row.querySelectorAll('input');
        fromEl.value = b.from;
        toEl.value = b.to;
        fromEl.addEventListener('change', () => { b.from = fromEl.value; saveBlocked(); });
        toEl.addEventListener('change', () => { b.to = toEl.value; saveBlocked(); });
        row.querySelector('button').onclick = () => {
          blocked.splice(i, 1);
          renderBlocked();
          saveBlocked();
        };
        blockedListEl.appendChild(row);
      });
    }

    document.getElementById('addBlocked').onclick = () => {
      blocked.push({ from: '09:00', to: '17:00' });
      renderBlocked();
      saveBlocked();
    };

    // Does a run [start, start + duration) in minutes since today's midnight overlap a blocked range?
    function isBlocked(start, duration) {
      const end = start + duration;
      return blocked.some(b => {
        if (!b.from || !b.to) return false;
        const bs = toMinutes(b.from, 0);
        let be = toMinutes(b.to, 0);
        if (be <= bs) be += 1440;
        return [-1440, 0, 1440].some(o => start < be + o && end > bs + o);
      });
    }

    document.querySelectorAll('.tabs button').forEach(btn => btn.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab').forEach(t => t.hidden = t.id !== btn.dataset.tab);
    });

    renderWeights();
    renderBlocked();

    function getDuration() {
      const v = parseInt(durationInput.value, 10);
      return Number.isFinite(v) && v > 0 ? Math.min(v, 240) : 45;
    }

    function toMinutes(value, fallback) {
      if (!value) return fallback;
      const [h, m] = value.split(':').map(Number);
      return h * 60 + m;
    }

    fromInput.value = getSetting('runFrom') || fromInput.value;
    toInput.value = getSetting('runTo') || toInput.value;
    durationInput.value = getSetting('runDuration') || durationInput.value;

    [fromInput, toInput, durationInput].forEach(input => input.addEventListener('change', () => {
      setSetting('runFrom', fromInput.value);
      setSetting('runTo', toInput.value);
      setSetting('runDuration', getDuration());
      rerun();
    }));

    // Higher is better. Ideal "feels like" temperature is about 10-15°C. Each penalty is scaled by its weight.
    function scoreHour(h) {
      let s = 100;
      const t = h.apparentTemp;
      if (t < 10) s -= (10 - t) * 3 * weights.temp;
      else if (t > 15) s -= (t - 15) * 4 * weights.temp;
      s -= h.precipProb * 0.5 * weights.rainChance;
      s -= h.precip * 20 * weights.rain;
      if (h.wind > 15) s -= (h.wind - 15) * 1.5 * weights.wind;
      s -= h.uv * 4 * weights.uv;
      if (h.humidity > 70) s -= (h.humidity - 70) * 0.5 * weights.humidity;
      if (!h.isDay) s -= 25 * weights.dark;
      return Math.max(0, Math.round(s));
    }

    async function load(lat, lon, label) {
      statusEl.textContent = 'Fetching the forecast…';
      cardsEl.innerHTML = '';
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        '&hourly=apparent_temperature,temperature_2m,precipitation_probability,precipitation,wind_speed_10m,uv_index,relative_humidity_2m,is_day' +
        '&timezone=auto&forecast_days=2';
      const res = await fetch(url);
      if (!res.ok) throw new Error('Weather service unavailable');
      const data = await res.json();
      const d = data.hourly;

      const hourly = d.time.map((time, i) => ({
        temp: d.temperature_2m[i],
        apparentTemp: d.apparent_temperature[i],
        precipProb: d.precipitation_probability[i] ?? 0,
        precip: d.precipitation[i] ?? 0,
        wind: d.wind_speed_10m[i],
        uv: d.uv_index[i] ?? 0,
        humidity: d.relative_humidity_2m[i],
        isDay: d.is_day[i] === 1
      }));

      // Linearly interpolate the hourly forecast at a minute offset from today's midnight.
      function conditionsAt(min) {
        const i = Math.min(Math.floor(min / 60), hourly.length - 2);
        const f = (min - i * 60) / 60;
        const a = hourly[i], b = hourly[i + 1];
        const lerp = k => a[k] + (b[k] - a[k]) * f;
        return {
          temp: lerp('temp'), apparentTemp: lerp('apparentTemp'), precipProb: lerp('precipProb'),
          precip: lerp('precip'), wind: lerp('wind'), uv: lerp('uv'), humidity: lerp('humidity'),
          isDay: f < 0.5 ? a.isDay : b.isDay
        };
      }

      const duration = getDuration();
      const now = new Date(Date.now() + data.utc_offset_seconds * 1000);
      const nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
      const fromMin = toMinutes(fromInput.value, 0);
      const toMin = toMinutes(toInput.value, 23 * 60 + 45);
      const maxMin = (hourly.length - 1) * 60;

      // Every quarter hour is a candidate start; score is the average over the whole run.
      const slots = [];
      for (let start = Math.ceil(Math.max(fromMin, nowMin) / 15) * 15; start <= toMin && start + duration <= maxMin; start += 15) {
        const samples = [];
        for (let t = start; t < start + duration; t += 15) samples.push(conditionsAt(t));
        const avg = k => samples.reduce((s, c) => s + c[k], 0) / samples.length;
        slots.push({
          start,
          blocked: isBlocked(start, duration),
          score: Math.round(samples.reduce((s, c) => s + scoreHour(c), 0) / samples.length),
          temp: avg('temp'), apparentTemp: avg('apparentTemp'), precipProb: avg('precipProb'),
          wind: avg('wind'), uv: avg('uv'), humidity: avg('humidity')
        });
      }

      if (!slots.length) {
        statusEl.textContent = `No running times left today in ${label} between ${fromInput.value} and ${toInput.value}.`;
        return;
      }

      // Only use blocked slots if nothing else is available; then show the single best one with a warning.
      const free = slots.filter(s => !s.blocked);
      const onlyBlocked = !free.length;
      const candidates = onlyBlocked ? slots : free;
      const maxPicks = onlyBlocked ? 1 : 3;

      // Pick the best starts, far enough apart so the runs don't overlap.
      const gap = Math.max(duration, 60);
      const best = [];
      for (const s of [...candidates].sort((a, b) => b.score - a.score || a.start - b.start)) {
        if (best.every(b => Math.abs(b.start - s.start) >= gap)) best.push(s);
        if (best.length === maxPicks) break;
      }

      const fmt = min => `${String(Math.floor(min / 60) % 24).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

      statusEl.textContent = onlyBlocked
        ? `⚠️ No free time left in ${label}; showing the best option during a blocked time.`
        : `Forecast for ${label}`;
      const medals = ['🥇', '🥈', '🥉'];
      cardsEl.innerHTML = best.map((h, i) => `
        <div class="card${h.blocked ? ' warning' : ''}">
          <div class="rank">${h.blocked ? '⚠️' : medals[i]}</div>
          <div class="time">${fmt(h.start)}</div>
          <div class="score">until ${fmt(h.start + duration)} · Score: ${h.score}/100</div>
          ${h.blocked ? '<div class="warn">Overlaps one of your blocked times.</div>' : ''}
          <ul>
            <li>🌡️ ${h.temp.toFixed(0)}°C (feels ${h.apparentTemp.toFixed(0)}°C)</li>
            <li>🌧️ ${h.precipProb.toFixed(0)}% rain</li>
            <li>💨 ${h.wind.toFixed(0)} km/h wind</li>
            <li>☀️ UV ${h.uv.toFixed(1)}</li>
            <li>💧 ${h.humidity.toFixed(0)}% humidity</li>
          </ul>
        </div>`).join('');
    }

    function run(lat, lon, label) {
      lastLocation = { lat, lon, label };
      setSetting('lastLocation', JSON.stringify(lastLocation));
      load(lat, lon, label).catch(err => statusEl.textContent = 'Error: ' + err.message);
    }

    function getSavedLocation() {
      try {
        const loc = JSON.parse(getSetting('lastLocation'));
        return loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lon) ? loc : null;
      } catch { return null; }
    }

    function useBrowserLocation() {
      resultsEl.innerHTML = '';
      const fallback = message => {
        const saved = getSavedLocation();
        if (saved) run(saved.lat, saved.lon, saved.label);
        else statusEl.textContent = message;
      };
      if (!navigator.geolocation) {
        fallback('Your browser does not support geolocation. Use the search box instead.');
        return;
      }
      statusEl.textContent = 'Getting your location…';
      navigator.geolocation.getCurrentPosition(
        pos => run(pos.coords.latitude, pos.coords.longitude,
          `your location (${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)})`),
        () => fallback('Location access denied. Use the search box to pick a location.')
      );
    }

    searchForm.addEventListener('submit', async e => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;
      resultsEl.innerHTML = '';
      statusEl.textContent = 'Searching…';
      try {
        const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&name=' + encodeURIComponent(query));
        if (!res.ok) throw new Error('Search service unavailable');
        const places = (await res.json()).results || [];
        if (!places.length) {
          statusEl.textContent = `No places found for "${query}".`;
          return;
        }
        statusEl.textContent = 'Pick a location:';
        places.forEach(p => {
          const label = [p.name, p.admin1, p.country].filter(Boolean).join(', ');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = label;
          btn.onclick = () => {
            resultsEl.innerHTML = '';
            run(p.latitude, p.longitude, label);
          };
          resultsEl.appendChild(btn);
        });
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      }
    });

    document.getElementById('geoBtn').onclick = useBrowserLocation;

    const savedLocation = getSavedLocation();
    if (savedLocation) {
      run(savedLocation.lat, savedLocation.lon, savedLocation.label);
    } else {
      useBrowserLocation();
    }
  </script>
</body>
</html>
</html>
